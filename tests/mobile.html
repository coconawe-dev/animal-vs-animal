<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>기기 레이아웃 확인 — 동물 vs 동물</title>
<style>
  html, body { margin: 0; background: #05070b; color: #cfd7e6; font-family: system-ui, sans-serif; }
  .wrap { display: flex; gap: 22px; padding: 18px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 12px; font-weight: 700; color: #8fa0bb; padding: 0 0 6px 2px; letter-spacing: 0.04em; }
  .phone, .tablet { border: 6px solid #2a3242; border-radius: 26px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.6); background: #000; }
  .phone iframe { width: 390px; height: 844px; border: 0; display: block; }
  .tablet iframe { width: 1180px; height: 810px; border: 0; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <figure>
    <figcaption>iPhone 390 × 844</figcaption>
    <div class="phone"><iframe src="../index.html?device=phone" title="phone"></iframe></div>
  </figure>
  <figure>
    <figcaption>iPad 가로 1180 × 810</figcaption>
    <div class="tablet"><iframe src="../index.html?device=tablet" title="tablet"></iframe></div>
  </figure>
</div>
</body>
</html>
