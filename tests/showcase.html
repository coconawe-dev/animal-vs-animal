<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모델 확인 — 동물 vs 동물</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1118; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from '../vendor/three.module.js';
import { ANIMALS } from '../src/config.js';
import { buildAnimalModel, animateRig } from '../src/models.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171c26);
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);

const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x2a2f38, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(6, 14, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.5);
fill.position.set(-10, 6, -8);
scene.add(fill);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(40, 64),
  new THREE.MeshStandardMaterial({ color: 0x2a3140, roughness: 0.95 }),
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

function label(text, x, y, z) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.font = '700 40px "Apple SD Gothic Neo", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(230,238,255,0.92)';
  ctx.fillText(text, 128, 34);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.position.set(x, y, z);
  sp.scale.set(3.4, 0.85, 1);
  scene.add(sp);
}

const cols = 4;
const spacing = 4.6;
const rigs = [];
ANIMALS.forEach((def, i) => {
  const col = i % cols;
  const row = Math.floor(i / cols);
  const x = (col - (cols - 1) / 2) * spacing;
  const z = (row - 0.5) * -5.4;
  const rig = buildAnimalModel(def, i % 2 ? 'red' : 'blue');
  rig.group.position.set(x, 0, z);
  rig.group.rotation.y = 0.35;
  if (rig.ring) rig.ring.visible = false;
  scene.add(rig.group);
  rigs.push({ rig, phase: i * 0.7 });
  label(`${def.emoji} ${def.name}`, x, rig.height + 0.8, z);
});

camera.position.set(0, 8.5, 20);
camera.lookAt(0, 1.2, -2.2);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  for (const { rig, phase } of rigs) {
    animateRig(rig, { dt, moving: false, speed: 0, attack: 0, skill: 0, hurt: 0, dead: false });
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});
window.__showcase = { scene, camera, rigs };
</script>
</body>
</html>
